[project]
name = "saas-api"
version = "0.1.0"
description = "Python API dependencies for the saas project"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "fastapi-clerk-auth",
    "uvicorn",
    "openai",
    "pydantic",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]